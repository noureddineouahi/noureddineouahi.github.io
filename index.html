<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Under Construction</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 46px 20px 32px;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main { width: 100%; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.0625rem);
      line-height: 1.2;
    }

    p {
      margin: clamp(28px, 4vw, 42px) auto 0;
      max-width: 56rem;
      color: #858585;
      font-size: clamp(1.125rem, 2.1vw, 1.8125rem);
      line-height: 1.6;
      letter-spacing: 0.25px;
    }

    p span { display: block; }

    ul {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px clamp(20px, 4vw, 60px);
      margin: clamp(28px, 4vw, 51px) 0 0;
      padding: 0;
      list-style: none;
    }

    li a {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      color: #808080;
      font-size: 15px;
      text-decoration: none;
    }

    a[href]:hover, a[href]:focus-visible { color: white; }
    a[href]:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    @media (max-width: 520px) {
      ul { display: grid; grid-template-columns: repeat(2, max-content); }
      li { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Site Under Construction</h1>
    <p>
      <span>Our website is currently undergoing scheduled maintenance.</span>
      <span>Thank you for your understanding.</span>
    </p>

    <!-- Add an href to each social link when you have its profile URL.
         For Mail, use a mailto: address. The small icons are embedded for offline use. -->
  </main>
</body>
</html>
